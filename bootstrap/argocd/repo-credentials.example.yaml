# Template. Copy to repo-credentials.sops.yaml, fill in the token, then
# `sops -e -i bootstrap/argocd/repo-credentials.sops.yaml` (.sops.yaml
# already routes bootstrap/*.sops.yaml to the platform Age key).
#
# WHY THIS LIVES IN bootstrap/ AND NOT IN kubernetes/
#
# Because the alternative is circular. A credential committed anywhere under
# kubernetes/ is only applied once ArgoCD has cloned this repo and rendered
# it — which is fine while the repo is public
# and anonymous cloning works, and breaks the instant it goes private:
# ArgoCD cannot read the repo to find the credential that would let it read
# the repo. That is the trap the old lxup/homelab arrangement was in. It
# never showed up because the repo was always public.
#
# So it is applied imperatively by cli/ (src/steps/07-argocd-repo-credentials.ts),
# right after ArgoCD is installed and before the root app is applied — the
# same place paveproject/infra and recomendapp/infra put theirs.
#
# RUN IT UNCONDITIONALLY. A Git credential ArgoCD does not need is simply
# unused, so having this in place while the repo is public costs nothing and
# means flipping it private later is a visibility toggle on GitHub and
# nothing else — no new bootstrap step, no scramble.
#
# `repo-creds`, not `repository`: the label below makes this a credential
# TEMPLATE matched by URL PREFIX, so one Secret covers every repo under
# github.com/lxup. A `repository` secret matches one exact URL, which means
# one entry per repo and a silent miss on any that is added later.
#
# TOKEN SCOPE: a fine-grained PAT with Contents: read-only on the lxup repos,
# or a classic PAT with `repo`. Do NOT paste the token from `gh auth token` —
# that is your personal keyring credential with gist/workflow/write:packages
# on everything you own. ArgoCD only ever needs to clone.
apiVersion: v1
kind: Secret
metadata:
  name: homelab-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
type: Opaque
stringData:
  # URL PREFIX, no .git suffix, no trailing slash.
  url: https://github.com/lxup
  username: lxup
  password: REPLACE_WITH_A_READ_ONLY_PAT
