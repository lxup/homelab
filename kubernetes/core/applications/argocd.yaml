# This tenant's ArgoCD Ingress and nothing else. The install itself is
# imperative (bootstrap/argocd/values.yaml, applied by cli/) so a bad sync
# can never take down the thing doing the syncing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lxup/homelab.git
    targetRevision: main
    path: kubernetes/core/services/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
