# App-of-apps for business/media apps (as opposed to kubernetes/core/,
# which is cluster infra). Dropped into kubernetes/core/applications/ as
# apps-root.yaml so the EXISTING core root picks it up automatically —
# no separate manual bootstrap step needed, same trick the apps-root
# pattern always uses.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100" # after all of core/ is healthy
spec:
  project: default
  source:
    repoURL: https://github.com/lxup/homelab.git
    targetRevision: main
    path: kubernetes/apps/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
