# MIGRATED into the homelab vcluster.
#
# Went early because it has no volume at all — a web Deployment, a Service,
# an Ingress and a ghcr pull secret — so it exercises the move with nothing
# to copy. Stateless also means the overlap is free: while both copies run,
# either one serves identical content, so lxup.net never notices.
#
# Second ksops exercise after gatus, and a different shape: the pull secret
# is a kubernetes.io/dockerconfigjson, not an Opaque.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lxup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lxup/homelab.git
    targetRevision: main
    path: kubernetes/apps/services/lxup
  destination:
    server: https://kubernetes.default.svc
    namespace: lxup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
