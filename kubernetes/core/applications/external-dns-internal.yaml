# Second external-dns instance, same Ingresses as the Cloudflare one
# (kubernetes/core/services/external-dns/) but writing into UniFi's own
# local DNS instead — so LAN/VPN clients resolve straight to the private
# LB IP without ever touching Cloudflare, and internal-only hosts
# (Grafana, Hubble) don't need a public DNS record at all.
# MOVED to this tenant's own ArgoCD — step 4b of the ingress handover.
#
# txtOwnerId stays `homelab-internal`, deliberately NOT a new one. The
# existing UniFi records are owned by that id and external-dns only ever
# touches what it owns — a fresh owner id would leave every record orphaned,
# updatable by nobody. That is the opposite of the rule between two
# different tenants, where distinct ids are what keeps them from fighting.
#
# The two instances agree on every value while they overlap: same hostnames,
# same .200 target (the in-vcluster Ingress status is synced back from the
# host). The host's instance goes away when its namespace is deleted in 4c.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-internal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lxup/homelab.git
    targetRevision: main
    path: kubernetes/apps/services/external-dns-internal
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns-internal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
