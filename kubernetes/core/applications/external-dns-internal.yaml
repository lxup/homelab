# Second external-dns instance: same Ingresses as the Cloudflare one, written
# into UniFi's local DNS instead, so LAN/VPN clients resolve straight to the
# private LB IP and internal-only hosts need no public record.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-internal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lxup/homelab.git
    targetRevision: main
    path: kubernetes/apps/services/external-dns-internal
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns-internal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
