apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gatus

resources:
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

generators:
  - ksops-generator.yaml

configMapGenerator:
  - name: gatus-config
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
