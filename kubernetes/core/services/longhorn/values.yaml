# GitOps renders this chart via `kustomize --enable-helm` (= `helm
# template`), which has no real Helm-hook semantics — the pre-upgrade
# check Job gets applied as a plain resource instead of running in order,
# racing the ServiceAccount it needs. Longhorn's own docs say to disable
# it for ArgoCD/GitOps installs.
preUpgradeChecker:
  jobEnabled: false

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3 # one replica per node — we only have 3

defaultSettings:
  defaultDataPath: /var/lib/longhorn
  # false (the real default): Longhorn auto-creates a default disk on every
  # node as it joins, no manual labeling needed. `true` requires manually
  # labeling each node `node.longhorn.io/create-default-disk=true` first —
  # we never did that, so every node sat with zero disks configured and
  # every volume stayed permanently unschedulable.
  createDefaultDiskLabeledNodes: false
