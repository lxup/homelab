# PLACEHOLDER — fill in your real R2 values, then encrypt in place:
#   sops -e -i kubernetes/core/services/longhorn/backup-target-credentials.sops.yaml
#
# From Cloudflare dashboard -> R2 -> Manage R2 API Tokens -> Create API
# Token (Object Read & Write, scoped to the "homelab" bucket only):
#   AWS_ACCESS_KEY_ID     -> the Access Key ID shown
#   AWS_SECRET_ACCESS_KEY -> the Secret Access Key shown
#   AWS_ENDPOINTS         -> the S3 API endpoint shown on the R2 overview
#                            page, looks like:
#                            https://<account_id>.r2.cloudflarestorage.com
apiVersion: v1
kind: Secret
metadata:
  name: longhorn-backup-target
  namespace: longhorn-system
stringData:
  AWS_ACCESS_KEY_ID: CHANGEME
  AWS_SECRET_ACCESS_KEY: CHANGEME
  AWS_ENDPOINTS: https://CHANGEME.r2.cloudflarestorage.com
