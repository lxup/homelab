# Backs up every PVC labeled recurring-job-group.longhorn.io/r2-backup=enabled
# (see vaultwarden-data and postgres-data PVCs) to the R2 backup target
# configured in values.yaml. "r2-backup" (not "default") on purpose — a
# known Longhorn bug causes a deadlock when a RecurringJob uses the group
# name "default".
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: r2-backup-daily
  namespace: longhorn-system
spec:
  cron: "0 3 * * *" # 03:00 daily — quiet hours
  task: backup
  groups:
    - r2-backup
  retain: 7
  concurrency: 2
