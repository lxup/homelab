# Same chart/release as kubernetes/core/services/external-dns/, second
# independent instance — one external-dns process talks to exactly one
# provider, so a second provider (UniFi) means a second Deployment, not
# extra config on the first one. Watches the same Ingresses, writes into
# UniFi's local DNS instead of Cloudflare.
provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/home-operations/external-dns-unifi-webhook
      tag: v0.10.12
    env:
      - name: UNIFI_HOST
        value: https://10.10.10.1
      - name: UNIFI_API_KEY
        valueFrom:
          secretKeyRef:
            name: unifi-dns-secret
            key: UNIFI_API_KEY
      - name: UNIFI_SKIP_TLS_VERIFY
        value: "true"
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /readyz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5

sources:
  - ingress

domainFilters:
  - nvlab.fr

policy: sync
registry: txt
txtOwnerId: homelab-internal
interval: 1m

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
