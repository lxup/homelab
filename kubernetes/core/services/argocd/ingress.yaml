# Public (needed for the GitHub webhook): UDM Pro port-forwards 80/443 to
# Traefik's LB IP, and the Cloudflare A record for argocd.nvlab.fr is kept
# pointed at the home WAN IP by the DDNS updater (../external-dns/), not by
# an ingress annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  tls:
    - hosts:
        - argocd.nvlab.fr
      secretName: argocd-tls
  rules:
    - host: argocd.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
