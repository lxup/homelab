apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
    # Opt-in flag read by external-dns's annotationFilter — this is the
    # only Ingress meant to get a real public Cloudflare record (needed
    # for the GitHub webhook). See kubernetes/core/services/external-dns/values.yaml.
    homelab.io/dns: public
spec:
  tls:
    - hosts:
        - argocd.nvlab.fr
      secretName: argocd-tls
  rules:
    - host: argocd.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
