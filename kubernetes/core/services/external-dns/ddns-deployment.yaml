# Why DDNS instead of external-dns for public records: the UDM Pro port-
# forwards 80/443 straight to Traefik's LoadBalancer IP (10.10.100.200),
# which is a private LAN address. A Cloudflare record pointing at that IP
# would be unreachable from the public internet — Cloudflare's edge can't
# route to RFC1918 space. The record Cloudflare needs is your home's public
# WAN IP, which only a DDNS updater (favonia/cloudflare-ddns) can track.
# external-dns's ingress-driven model (target = Service/Ingress LB IP) is
# a different job entirely (and still runs for LAN/VPN resolution — see
# ../external-dns-internal/), not something this instance competes with.
#
# Two Deployments, not one, because Cloudflare's proxy (orange cloud) is an
# all-or-nothing setting per DDNS instance (PROXIED), but we want it to
# differ per host — every hostname below gets its own independent, direct
# A record (no CNAMEs), grouped by whether the proxy's trade-offs are worth
# it for that host:
#
# - cloudflare-ddns-proxied (PROXIED=true): nvlab.fr (apex), argocd, and
#   bitwarden. Low-bandwidth hosts, so Cloudflare's WAF/DDoS protection and
#   hidden origin IP are worth it.
# - cloudflare-ddns (PROXIED=false): cloud (Nextcloud), jellyfin, media
#   (Plex), immich, paperless. Cloudflare's proxy enforces a hard 100MB
#   request/upload cap on these plans, which would break Nextcloud/Immich/
#   Paperless uploads (original-quality photo/video, scanned documents),
#   and separately, proxying sustained video streaming goes against
#   Cloudflare's ToS for free/Pro plans — not worth the trade-off here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      containers:
        - name: cloudflare-ddns
          image: ghcr.io/favonia/cloudflare-ddns:1
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
            - name: DOMAINS
              value: cloud.nvlab.fr,jellyfin.nvlab.fr,media.nvlab.fr,immich.nvlab.fr,paperless.nvlab.fr
            - name: PROXIED
              value: "false"
            - name: IP6_PROVIDER
              value: "none"
            - name: UPDATE_CRON
              value: "@every 5m"
            - name: DELETE_ON_STOP
              value: "false"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns-proxied
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-ddns-proxied
  template:
    metadata:
      labels:
        app: cloudflare-ddns-proxied
    spec:
      containers:
        - name: cloudflare-ddns
          image: ghcr.io/favonia/cloudflare-ddns:1
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
            - name: DOMAINS
              value: nvlab.fr,argocd.nvlab.fr,bitwarden.nvlab.fr
            - name: PROXIED
              value: "true"
            - name: IP6_PROVIDER
              value: "none"
            - name: UPDATE_CRON
              value: "@every 5m"
            - name: DELETE_ON_STOP
              value: "false"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
