# node-exporter needs hostPID + hostNetwork + hostPath (/proc, /sys) to read
# per-node hardware metrics — same privileged requirement as Longhorn, same
# fix: the cluster's default "baseline" Pod Security admission would
# otherwise reject every node-exporter pod outright.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
