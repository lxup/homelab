service:
  type: LoadBalancer
  # Kubernetes/Cilium drops mixed TCP+UDP ports from one LoadBalancer here.
  # The chart's split-service mode lets Cilium share the same IP across the
  # TCP and UDP Services (required because LAN DNS points at one IP).
  single: false
  annotations:
    lbipam.cilium.io/sharing-key: traefik
    lbipam.cilium.io/ips: 10.10.100.200

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    # Use a numeric target so Kubernetes can route the HTTP/3 UDP Service
    # even if it merges away the duplicate named TCP/UDP container port.
    targetPort: 8443
    http:
      tls:
        enabled: true
    # HTTP/3 uses QUIC over UDP/443. This is needed by LAN clients whose
    # split-DNS points directly at Traefik instead of Cloudflare.
    http3:
      enabled: true
      # Keep UDP distinct from TCP/443 so Cilium can assign both Services
      # the same LoadBalancer IP; Traefik advertises this via Alt-Svc.
      advertisedPort: 8443

ingressClass:
  enabled: true
  isDefaultClass: true

# Traefik refuses to route to ExternalName Services by default since
# v2.4.10 (hardening against a Kubernetes CVE) — needed for
# nas-passthrough/media.yaml (Plex, still NAS-hosted), which backs its
# Ingress with an ExternalName Service pointing at the NAS's IP. Without
# this, Traefik silently has no router for that host at all (generic
# "404 page not found", easy to mistake for a backend problem).
providers:
  kubernetesIngress:
    allowExternalNameServices: true
