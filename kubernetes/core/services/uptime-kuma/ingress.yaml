# LAN-only (same reasoning as Grafana/Hubble): no homelab.io/dns annotation
# and not in the DDNS updater's DOMAINS — an uptime dashboard doesn't need
# to be internet-reachable, and notifications fire from Kuma's own
# outbound calls to Telegram regardless of whether the UI itself is public.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - uptime.nvlab.fr
      secretName: uptime-kuma-tls
  rules:
    - host: uptime.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
