# This instance is a 3rd, always-on peer — not a server. MacBook Pro and
# the gaming PC each run their own normal Syncthing install; this one just
# stays online so the two sync even when they're never both awake at the
# same time. Folders/device pairing are set up once via the GUI (device
# IDs don't exist until each machine's own Syncthing is installed) —
# nothing to template in git for that part.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
spec:
  # Temporarily 0 to fix root-owned config.xml left by the earlier
  # root-running init container — revert to 1 right after.
  replicas: 0
  strategy:
    type: Recreate # single ReadWriteOnce volume
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      # `syncthing generate` only touches the GUI user/password fields
      # (bcrypt-hashed into config.xml) and leaves everything else alone —
      # safe to re-run idempotently on every pod start, including the
      # device cert/ID already generated on first boot.
      #
      # --home MUST be /var/syncthing/config, not the /var/syncthing mount
      # root — the image's own entrypoint sets STHOMEDIR=/var/syncthing/config
      # internally (a nested subdir), confirmed by exec'ing into the
      # running container. Using the mount root here silently writes to an
      # unused parallel config the server never reads.
      #
      # runAsUser/runAsGroup: 1000 on the init container specifically —
      # overriding `command:` bypasses the image's own entrypoint (which
      # normally drops from root to 1000 per PUID/PGID), so without this
      # the generate command runs as root and leaves config.xml owned by
      # root, which the main container (correctly running as 1000) then
      # can't read ("permission denied" on startup).
      initContainers:
        - name: set-gui-credentials
          image: syncthing/syncthing:2.1.5
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - syncthing
            - generate
            - --home=/var/syncthing/config
            - --gui-user=$(STGUIUSER)
            - --gui-password=$(STGUIPASSWORD)
          env:
            - name: STGUIUSER
              valueFrom:
                secretKeyRef:
                  name: gui-credentials
                  key: STGUIUSER
            - name: STGUIPASSWORD
              valueFrom:
                secretKeyRef:
                  name: gui-credentials
                  key: STGUIPASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/syncthing
      containers:
        - name: syncthing
          image: syncthing/syncthing:2.1.5
          ports:
            - name: gui
              containerPort: 8384
            - name: sync-tcp
              containerPort: 22000
              protocol: TCP
            - name: sync-udp
              containerPort: 22000
              protocol: UDP
            - name: discovery
              containerPort: 21027
              protocol: UDP
          volumeMounts:
            - name: data
              mountPath: /var/syncthing
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /rest/noauth/health
              port: 8384
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: syncthing-data
