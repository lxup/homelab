# Device pairing (cert/ID) + the synced files themselves (TotalMix
# presets, OBS scenes, etc.) — small, irreplaceable, worth the R2 backup.
# Longhorn, not NFS: small config files syncing constantly, no reason to
# put NAS/NFS latency in the loop.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-data
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/r2-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
