# Public (user wants remote GUI access), proxied group — low-bandwidth
# GUI only, the actual sync protocol goes through service-sync.yaml's own
# LoadBalancer IP, not this Ingress. GUI auth is mandatory here (see the
# init container in deployment.yaml) precisely because it's reachable
# from the internet, not just the LAN.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syncthing
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - syncthing.nvlab.fr
      secretName: syncthing-tls
  rules:
    - host: syncthing.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: syncthing-gui
                port:
                  number: 8384
