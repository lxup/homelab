# /media mounted read-only at /media, matching what the migrated
# library.db already expects (confirmed on first boot — libraries
# auto-discovered correctly, no re-pathing needed).
#
# gpu.intel.com/i915 requests the same iGPU already used by Immich's ML
# service (kubernetes/apps/services/immich/ml-deployment.yaml) — 3 nodes,
# 1 unit each, so this just needs to land on a different node than
# whichever one Immich's ML pod is on, which the scheduler handles on its
# own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  # Temporarily 0 for a full config reset (user request — migrated DB got
  # emptied by Jellyfin's own clean-up task during the NFS mount outages,
  # not worth untangling; media files on the NAS are untouched, user has
  # the old NAS container as a fallback too) — revert to 1 right after the
  # PVC is wiped.
  replicas: 0
  strategy:
    type: Recreate # single ReadWriteOnce volumes (config, cache)
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.1
          ports:
            - containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              gpu.intel.com/i915: 1
            limits:
              cpu: 4
              memory: 4Gi
              gpu.intel.com/i915: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 30
          # Nextcloud's NFS mount has gone stale (ESTALE) multiple times on
          # this NAS with no probe to catch it, staying silently broken for
          # hours — adding this here too since /media is NFS the same way.
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: media
          nfs:
            server: 10.10.10.101
            path: /mnt/user/media
            readOnly: true
