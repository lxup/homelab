# Public via the UDM Pro's 80/443 port-forward to Traefik's LB IP — the
# Cloudflare A record for jellyfin.nvlab.fr is kept pointed at the home
# WAN IP by the DDNS updater (kubernetes/core/services/external-dns/),
# unproxied group (video streaming, same reasoning as Nextcloud/Immich).
# Cut over from the old NAS instance after verifying migrated
# config/libraries and GPU transcoding worked on the temporary
# jellyfin-new.nvlab.fr hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jellyfin.nvlab.fr
      secretName: jellyfin-tls
  rules:
    - host: jellyfin.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
