# Migrated from the NAS: DB via pg_dump/pg_restore (136 tables), then
# climbed 25 -> 35 one image-tag bump at a time since Nextcloud refuses to
# skip major versions (each bump ran its own `occ upgrade` first — see
# README git history for the climb log). Cutover is complete, old NAS
# instance decommissioned.
#
# data volume is read-write — occ needs write access to /data even for
# read-only-seeming commands like `occ status` (log file, writability
# checks).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      securityContext:
        fsGroup: 33 # www-data, matches the official image's runtime user
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/config.php ]; then
                echo "Seeding config.php (first run)"
                cp /seed/config.php /config/config.php
              else
                echo "config.php already present, leaving it alone"
              fi
              chmod 0775 /config
              chmod 0664 /config/config.php
              chown 33:33 /config/config.php # occ requires exact UID ownership match, not just group-write
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: nextcloud
          image: nextcloud:35-apache
          ports:
            - containerPort: 80
          env:
            # Makes Apache's workers — the processes that actually write
            # files — run with group `users` (gid 100) instead of
            # `www-data` (gid 33), so everything Nextcloud creates on the
            # /naegativ share lands as 33:100 and stays writable over SMB.
            # Every Unraid Share User is in `users` already, and the whole
            # share is gid 100, so gid 100 is the shared group; no group
            # needs creating on the NAS (Unraid's rootfs is in RAM, so a
            # custom group would have to be recreated from
            # /boot/config/go on every boot).
            #
            # This is an env var and NOT `runAsGroup`/`supplementalGroups`
            # on the pod, because neither would survive: PID 1 here is
            # root, and Apache does its own setgid + initgroups() per
            # worker, which REPLACES whatever group list the pod spec set.
            # `apache2.conf` reads `Group ${APACHE_RUN_GROUP}` and
            # /etc/apache2/envvars defaults it with `:=`, so an env var
            # set here wins. Pairs with `localstorage.umask => 0007` in
            # config.php, which makes those files 0660 and dirs 0770
            # (group rw, nothing for "other").
            - name: APACHE_RUN_GROUP
              value: users
          volumeMounts:
            - name: config
              mountPath: /var/www/html/config
            - name: custom-apps
              mountPath: /var/www/html/custom_apps
            - name: data
              mountPath: /data
            # Backs the "/Naegativ" files_external mount (mount ID 4), a
            # Local-backend external storage whose datadir is /naegativ,
            # scoped to the "Naegativ Team" group with sharing enabled.
            # That Nextcloud-side config survived the NAS migration
            # untouched — only this pod-side mount was missing, so the
            # storage sat broken with `occ files_external:verify 4`
            # reporting 'Local storage path does not exist "/naegativ/"'.
            # Nextcloud has no NFS storage backend (S3, FTP, Local,
            # Nextcloud, Swift, SFTP, SMB, WebDAV only), so the share is
            # mounted into the pod here and surfaced through the Local
            # backend rather than configured as an NFS external storage.
            - name: naegativ
              mountPath: /naegativ
          # Bumped after an OOMKill (exit 137) during a desktop client sync
          # burst (lots of concurrent PROPFIND on a deeply nested folder
          # tree) — went generous rather than just covering that one case:
          # each node has 15GB allocatable with only 3-5GB in use
          # cluster-wide, so there's no reason to ration a single pod.
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: 4
              memory: 6Gi
          # Had no probes at all until a stale NFS mount (recurring issue
          # on this NAS — see README) left the pod "Running" and silently
          # serving 503s for hours with nothing to notice or recover.
          # status.php already reflects mount health (confirmed: it 503s
          # exactly when /data is stale) — livenessProbe means a stale
          # mount now self-heals via restart instead of staying broken
          # until someone notices and restarts it by hand.
          #
          # httpHeaders Host override is required: kubelet's probe uses the
          # pod IP as Host by default, which Nextcloud rejects outright
          # ({"error":"Trusted domain error.","code":15}, HTTP 400) since
          # trusted_domains only lists cloud.nvlab.fr — confirmed this
          # caused false-positive probe failures on a perfectly healthy
          # pod before this fix.
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: cloud.nvlab.fr
            initialDelaySeconds: 20
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: cloud.nvlab.fr
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: seed
          secret:
            secretName: nextcloud-config-seed
        - name: config
          persistentVolumeClaim:
            claimName: nextcloud-config
        - name: custom-apps
          persistentVolumeClaim:
            claimName: nextcloud-custom-apps
        - name: data
          nfs:
            server: 10.10.10.101
            path: /mnt/user/nextcloud
        # Unlike /data, this mount is NOT covered by the livenessProbe:
        # /status.php reflects the /data mount's health only and doesn't
        # touch external storages, so an ESTALE here (see README "NFS
        # stability") breaks the Naegativ folder without restarting the
        # pod to self-heal. It surfaces as errors on that one folder in
        # the web UI, not as a dead pod — check
        # `occ files_external:verify 4` when it misbehaves.
        - name: naegativ
          nfs:
            server: 10.10.10.101
            path: /mnt/user/naegativ
