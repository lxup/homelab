# Starts at :25-apache to match the migrated database exactly (Nextcloud
# refuses to skip major versions) — climbs 25 -> 35 one image-tag bump at
# a time, each one let to run its own `occ upgrade` before moving to the
# next. See README for the climb log.
#
# data volume is read-write against the SAME NFS share the old NAS
# instance still uses — occ requires write access to /data even just to
# run `occ status` (log file, writability checks), so this can't be
# deferred to final cutover like the DB copy was. Avoid using the old
# instance while this climb is in progress to prevent both writing
# concurrently; final cutover = stop the old instance for good + DNS flip.
#
# DB copied from the NAS via pg_dump/pg_restore (136 tables, clean).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      securityContext:
        fsGroup: 33 # www-data, matches the official image's runtime user
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/config.php ]; then
                echo "Seeding config.php (first run)"
                cp /seed/config.php /config/config.php
              else
                echo "config.php already present, leaving it alone"
              fi
              chmod 0775 /config
              chmod 0664 /config/config.php
              chown 33:33 /config/config.php # occ requires exact UID ownership match, not just group-write
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: nextcloud
          image: nextcloud:26-apache
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /var/www/html/config
            - name: custom-apps
              mountPath: /var/www/html/custom_apps
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 1Gi
      volumes:
        - name: seed
          secret:
            secretName: nextcloud-config-seed
        - name: config
          persistentVolumeClaim:
            claimName: nextcloud-config
        - name: custom-apps
          persistentVolumeClaim:
            claimName: nextcloud-custom-apps
        - name: data
          nfs:
            server: 10.10.10.101
            path: /mnt/user/nextcloud
