# Migrated from the NAS: DB via pg_dump/pg_restore (136 tables), then
# climbed 25 -> 35 one image-tag bump at a time since Nextcloud refuses to
# skip major versions (each bump ran its own `occ upgrade` first — see
# README git history for the climb log). Cutover is complete, old NAS
# instance decommissioned.
#
# data volume is read-write — occ needs write access to /data even for
# read-only-seeming commands like `occ status` (log file, writability
# checks).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      securityContext:
        # 100 = `users`, not 33 = `www-data`, so the config and custom_apps
        # PVCs are group-owned by the same gid Apache's workers run under
        # (see APACHE_RUN_GROUP below). Setting APACHE_RUN_GROUP without
        # this took the instance down with "Cannot write into config
        # directory": Apache's per-worker initgroups() leaves the worker
        # with gid 100 and NO membership of 33, because the image's
        # /etc/group entry is `www-data:x:33:` with no members — 33 is only
        # www-data's primary gid in /etc/passwd. config.php itself stays
        # chowned 33:33 by the init container and is reached through the
        # owner bits, which is what `occ` needs. Verified against a throwaway
        # PVC before this went in: dir 0:100 0775 and writable by uid 33 /
        # gid 100, config.php writable, atomic tmp+rename writes fine.
        # Does not affect /data: fsGroup is ignored for nfs volumes.
        fsGroup: 100
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/config.php ]; then
                echo "Seeding config.php (first run)"
                cp /seed/config.php /config/config.php
              else
                echo "config.php already present, leaving it alone"
              fi
              # Own the dirs by UID 33, not just group: Apache's workers run
              # as 33:100 (APACHE_RUN_GROUP) while `occ` runs as 33:33,
              # because `su www-data` calls initgroups() and drops the gid
              # 100 that fsGroup injects. Group-write alone therefore serves
              # exactly one of the two and breaks the other with "Cannot
              # write into config directory" — group-owning by 100 broke occ,
              # by 33 broke Apache. Both run as UID 33, so the owner bits are
              # the only thing that covers both. Verified on the live pod
              # with the failing invocation (groups=33 only): occ status and
              # files_external:verify both recovered on this chown alone.
              chown 33:100 /config /custom_apps
              chmod 0775 /config /custom_apps
              chmod 0664 /config/config.php
              chown 33:33 /config/config.php # occ requires exact UID ownership match, not just group-write
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
            - name: config
              mountPath: /config
            # Mounted only so the chown above reaches it; app installs and
            # updates write here from both Apache and occ.
            - name: custom-apps
              mountPath: /custom_apps
      containers:
        - name: nextcloud
          image: nextcloud:35-apache
          ports:
            - containerPort: 80
          env:
            # Apache's workers — the processes that write files — run with
            # group `users` (gid 100) instead of `www-data` (gid 33), so
            # everything Nextcloud creates on /naegativ lands as 33:100 and
            # stays writable over SMB. Every Unraid Share User is in `users`
            # already and the whole share is gid 100, so no group needs
            # creating on the NAS (its rootfs is in RAM, so a custom group
            # would have to be recreated from /boot/config/go every boot).
            # Requires fsGroup: 100 above — see the comment there.
            #
            # An env var, not runAsGroup/supplementalGroups: PID 1 here is
            # root and Apache's per-worker setgid + initgroups() replaces
            # whatever group list the pod spec set. apache2.conf reads
            # `Group ${APACHE_RUN_GROUP}` and /etc/apache2/envvars defaults
            # it with `:=`, so this wins.
            - name: APACHE_RUN_GROUP
              value: users
          volumeMounts:
            - name: config
              mountPath: /var/www/html/config
            - name: custom-apps
              mountPath: /var/www/html/custom_apps
            - name: data
              mountPath: /data
            # Backs the "/Naegativ" files_external mount (mount ID 4), a
            # Local-backend external storage whose datadir is /naegativ,
            # scoped to the "Naegativ Team" group with sharing enabled.
            # That Nextcloud-side config survived the NAS migration
            # untouched — only this pod-side mount was missing, so the
            # storage sat broken with `occ files_external:verify 4`
            # reporting 'Local storage path does not exist "/naegativ/"'.
            # Nextcloud has no NFS storage backend (S3, FTP, Local,
            # Nextcloud, Swift, SFTP, SMB, WebDAV only), so the share is
            # mounted into the pod here and surfaced through the Local
            # backend rather than configured as an NFS external storage.
            - name: naegativ
              mountPath: /naegativ
          # Bumped after an OOMKill (exit 137) during a desktop client sync
          # burst (lots of concurrent PROPFIND on a deeply nested folder
          # tree) — went generous rather than just covering that one case:
          # each node has 15GB allocatable with only 3-5GB in use
          # cluster-wide, so there's no reason to ration a single pod.
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: 4
              memory: 6Gi
          # Had no probes at all until a stale NFS mount (recurring issue
          # on this NAS — see README) left the pod "Running" and silently
          # serving 503s for hours with nothing to notice or recover.
          # status.php does reflect mount health (confirmed: it 503s
          # exactly when /data is stale), so the probes make the failure
          # loud. They do NOT heal it, contrary to what this comment
          # claimed before 2026-10-16: a probe failure restarts the
          # container, while the NFS volume belongs to the pod — the
          # kubelet mounts it before any container starts, so the restart
          # reuses the same stale mount. The kubelet then cannot even
          # `stat` that directory to build the next container's OCI spec,
          # and the pod wedges in CreateContainerError. Only
          # `kubectl delete pod` forces a fresh mount.
          #
          # httpHeaders Host override is required: kubelet's probe uses the
          # pod IP as Host by default, which Nextcloud rejects outright
          # ({"error":"Trusted domain error.","code":15}, HTTP 400) since
          # trusted_domains only lists cloud.nvlab.fr — confirmed this
          # caused false-positive probe failures on a perfectly healthy
          # pod before this fix.
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: cloud.nvlab.fr
            initialDelaySeconds: 20
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: cloud.nvlab.fr
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: seed
          secret:
            secretName: nextcloud-config-seed
        - name: config
          persistentVolumeClaim:
            claimName: nextcloud-config
        - name: custom-apps
          persistentVolumeClaim:
            claimName: nextcloud-custom-apps
        - name: data
          nfs:
            server: 10.10.10.101
            path: /mnt/user/nextcloud
        # Unlike /data, this mount is NOT covered by the livenessProbe:
        # /status.php reflects the /data mount's health only and doesn't
        # touch external storages, so an ESTALE here (see README "NFS
        # stability") breaks the Naegativ folder without restarting the
        # pod to self-heal. It surfaces as errors on that one folder in
        # the web UI, not as a dead pod — check
        # `occ files_external:verify 4` when it misbehaves.
        - name: naegativ
          nfs:
            server: 10.10.10.101
            path: /mnt/user/naegativ
