apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-config
  labels:
    # Opte ce PVC dans le RecurringJob "r2-backup" (quotidien, 7 conservés) —
    # voir lxup/platform, kubernetes/platform/services/longhorn/recurring-job.yaml.
    # Ces deux volumes n'étaient couverts par rien : ni sauvegarde, ni
    # régénérables (la config Nextcloud et les applications installées se
    # reperdraient). Sauvegarder 3 Gi coûte moins cher que de garder une
    # seconde réplique pour les protéger.
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/r2-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-custom-apps
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/r2-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
