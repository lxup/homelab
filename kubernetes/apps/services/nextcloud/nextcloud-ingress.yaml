# Cutover complete, now live and public. Cloudflare's A record for
# cloud.nvlab.fr is kept pointed at the home WAN IP by the DDNS updater
# (kubernetes/core/services/external-dns/), and the UDM Pro port-forwards
# 80/443 to Traefik's LB IP, which routes here by Host header.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cloud.nvlab.fr
      secretName: nextcloud-tls
  rules:
    - host: cloud.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud
                port:
                  number: 80
