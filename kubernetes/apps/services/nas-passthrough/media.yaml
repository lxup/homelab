# ExternalName with a literal IP — see jellyfin.yaml for why (not a
# selector-less Service + manual Endpoints, which ArgoCD silently drops).
#
# Plex (port 32400). After this is live, set "Custom server access URLs"
# to https://media.nvlab.fr:443 in Plex's Network settings — otherwise
# Plex's own remote-access detection (which expects a direct 32400
# forward) won't recognize traffic arriving via Traefik on 443.
apiVersion: v1
kind: Service
metadata:
  name: media-nas
spec:
  type: ExternalName
  externalName: "10.10.10.101"
  ports:
    - port: 32400
      targetPort: 32400
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-nas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - media.nvlab.fr
      secretName: media-nas-tls
  rules:
    - host: media.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: media-nas
                port:
                  number: 32400
