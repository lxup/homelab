# ExternalName with a literal IP, not a selector-less Service + manual
# Endpoints: ArgoCD excludes Endpoints/EndpointSlice from management by
# default (resource.exclusions in argocd-cm, to cut watch/UI noise), so a
# manually-committed Endpoints object is silently never applied — found
# this the hard way (Service with zero backends, Traefik returning 503).
# Traefik resolves ExternalName services itself at the provider level
# (not through kube-dns), so a raw IP here works fine as the backend.
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-nas
spec:
  type: ExternalName
  externalName: "10.10.10.101"
  ports:
    - port: 8096
      targetPort: 8096
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-nas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jellyfin.nvlab.fr
      secretName: jellyfin-nas-tls
  rules:
    - host: jellyfin.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin-nas
                port:
                  number: 8096
