apiVersion: v1
kind: Service
metadata:
  name: jellyfin-nas
spec:
  ports:
    - port: 8096
      targetPort: 8096
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jellyfin-nas
subsets:
  - addresses:
      - ip: 10.10.10.101
    ports:
      - port: 8096
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-nas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jellyfin.nvlab.fr
      secretName: jellyfin-nas-tls
  rules:
    - host: jellyfin.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin-nas
                port:
                  number: 8096
