# -openvino image variant + the Intel GPU device plugin resource
# (gpu.intel.com/i915, see kubernetes/core/applications/intel-gpu-plugin.yaml)
# to run face/CLIP recognition on the same iGPU already in each node.
# Service name "immich-machine-learning" matches what immich-server
# assumes by default (http://immich-machine-learning:3003) — no extra
# config needed on the server side to find this.
#
# Confirmed actually using the GPU after deploy: /dev/dri present in the
# pod (render-node device is world-writable, no supplementalGroups
# needed) and logs show OpenVINOExecutionProvider ahead of CPU fallback.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume (model-cache)
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      # See server-deployment.yaml for why.
      enableServiceLinks: false
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.2.4-openvino
          ports:
            - containerPort: 3003
          volumeMounts:
            - name: model-cache
              mountPath: /cache
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              gpu.intel.com/i915: 1
            limits:
              cpu: 4
              memory: 4Gi
              gpu.intel.com/i915: 1
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
