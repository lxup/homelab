# sync-wave 1: must land strictly after the cert-manager CRDs (wave 0,
# implicit) are established, or the API server rejects these with "could
# not find the requested resource" — CRD registration isn't instant.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selfSigned: {}
---
# DNS-01 via Cloudflare, not HTTP-01: Traefik's LoadBalancer IP
# (10.10.100.200-.250) is private, so Let's Encrypt's validation servers
# can never reach it over HTTP. DNS-01 just needs the Cloudflare API
# (api-token Secret below), no inbound connectivity required at all.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: hello@nvlab.fr
    privateKeySecretRef:
      name: letsencrypt-production-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
