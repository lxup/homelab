# Data migrated from the NAS (appdata/bitwarden) via a one-off Job —
# db.sqlite3, rsa keys, config.json, sends and icon_cache all copied
# cleanly. 4 individual attachment files couldn't be read (Unraid's
# "Public" NFS mode all_squash's every client to nobody, independent of
# the reading pod's UID) — everything else, including every password and
# the encryption keys, is intact.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
spec:
  # Temporarily 0 to test that Gatus actually fires a Telegram alert —
  # revert to 1 right after confirming.
  replicas: 0
  strategy:
    type: Recreate # single ReadWriteOnce volume — never run two pods at once
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.3
          env:
            - name: DOMAIN
              value: https://bitwarden.nvlab.fr
            - name: SIGNUPS_ALLOWED
              value: "false" # existing vault, migrated users only
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
