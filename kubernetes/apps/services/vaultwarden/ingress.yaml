# No homelab.io/dns: public — LAN/VPN only for now (same reasoning as
# Grafana/Hubble). DNS-01 still gets a real trusted cert regardless, since
# it only needs the Cloudflare API, not public reachability.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bitwarden.nvlab.fr
      secretName: vaultwarden-tls
  rules:
    - host: bitwarden.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
