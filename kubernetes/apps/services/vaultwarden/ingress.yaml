# Public via the UDM Pro's 80/443 port-forward to Traefik's LB IP — the
# Cloudflare A record for bitwarden.nvlab.fr is kept pointed at the home
# WAN IP by the DDNS updater (kubernetes/core/services/external-dns/),
# not by an ingress annotation. DNS-01 cert issuance only needs the
# Cloudflare API, independent of any of this.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bitwarden.nvlab.fr
      secretName: vaultwarden-tls
  rules:
    - host: bitwarden.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
