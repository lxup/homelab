# LAN-only (same reasoning as Grafana/Hubble): no homelab.io/dns annotation
# and not in the DDNS updater's DOMAINS — a status page doesn't need to be
# internet-reachable, and Telegram alerts fire from Gatus's own outbound
# calls regardless of whether the UI itself is public.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatus
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - status.nvlab.fr
      secretName: gatus-tls
  rules:
    - host: status.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatus
                port:
                  number: 8080
