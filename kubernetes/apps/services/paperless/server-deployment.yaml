# /usr/src/paperless/media (documents + thumbnails) is NFS, same NAS as
# Nextcloud/Immich, own dedicated share — not Longhorn, same reasoning as
# everywhere else: bulk file storage belongs on the NAS. /data (search
# index, classification model) stays on Longhorn — small, fast, and
# rebuildable from the documents if ever lost.
#
# No consume-folder (watched directory for scanner "scan to folder"
# workflows) for now — upload via the web UI covers the stated use case.
# Add one later: a second NFS mount at /usr/src/paperless/consume plus
# PAPERLESS_CONSUMPTION_DIR, once that subfolder exists on the share.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume (paperless-data)
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      enableServiceLinks: false
      # The app runs as uid 1000 (the image's `paperless` user, per
      # /etc/passwd) while everything on the NAS share is owned 99:100 —
      # Unraid's nobody:users convention. The share root is 0777 so creating
      # a file there worked, which made a naive `touch` test pass, but
      # `media.lock` was 0644 and `documents/` 0755: paperless could neither
      # take its media lock nor write a document, and every consume failed
      # with "[Errno 13] Permission denied: media.lock".
      #
      # fsGroup puts gid 100 in the process's supplementary groups, which is
      # what the NFS server checks under sec=sys. Verified on a throwaway pod
      # before this went in: runAsUser 1000 + fsGroup 100 yields
      # `groups=1000 100`, and the share was then chmod'd g+w with g+s on
      # directories so the group bits actually grant write and new files
      # inherit gid 100 (keeping them writable over SMB).
      #
      # NOT a chown to 1000:100 on the NAS instead: that would show an
      # unknown owner in the Unraid UI and break step with every other share.
      # NOT USERMAP_UID=99 either — it would fix the NFS side and lose the
      # Longhorn data volume, which is 1000:1000.
      #
      # Side effect to know about: fsGroup is ignored for the nfs volume but
      # does apply to the Longhorn one, so `data` gets a recursive chgrp to
      # 100 on every pod start. Harmless (uid 1000 still owns it) and only
      # costs a few seconds. Same pattern as the nextcloud deployment.
      securityContext:
        fsGroup: 100
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1
          env:
            # The group paperless's processes actually run with, and the
            # whole point of this block. fsGroup alone does not survive: s6
            # is PID 1 as root and drops to the paperless user with a setuid
            # helper whose initgroups() rebuilds the group list from
            # /etc/group, where `paperless:x:1000:` has no members — so the
            # gid 100 the pod spec injected is dropped before the app ever
            # runs. Measured on the live pod: celery and granian came up with
            # `groups=1000` and both writes still failed.
            #
            # USERMAP_GID changes the paperless group's gid itself
            # (/etc/s6-overlay/s6-rc.d/init-modify-user/run groupmods it), so
            # 100 becomes the primary gid and initgroups() keeps it. Requires
            # the container to start as root, which it does — that same
            # script skips the remap entirely for a non-root start and only
            # logs a warning, so do not add runAsUser here.
            - name: USERMAP_GID
              value: "100"
            - name: PAPERLESS_URL
              value: https://paperless.nvlab.fr
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Paris
            # ocrmypdf's parallel job count, and the reason this pod was
            # OOMKilled on 2026-11-20 at 08:10 UTC. Paperless derives the
            # default from os.cpu_count(), which inside a container reports
            # the NODE's cores — 12 on an EliteDesk — not the 2 the cgroup
            # actually allows (cpu.max = 200000/100000). It therefore ran OCR
            # with twelve parallel jobs, each holding its page images, and the
            # burst reached the 2Gi limit.
            #
            # Measured rather than guessed: the container's baseline is flat
            # at ~1Gi over seven days with no drift, so there is no leak. The
            # sampled working_set metric never showed the spike because it
            # happens between scrapes; container_memory_max_usage_bytes, a
            # high-water mark, recorded exactly 2048Mi twice in that week.
            #
            # 2 to match cpu.max. This costs no throughput — twelve threads
            # could never run on two cores, they only allocated as if they
            # could. The memory limit is deliberately left at 2Gi: raising it
            # would have moved the ceiling without touching the cause, and
            # with the burst bounded there is now ample headroom above the
            # 1Gi baseline.
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "2"
            - name: PAPERLESS_OCR_LANGUAGE
              value: fra
            - name: PAPERLESS_REDIS
              value: redis://redis:6379
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              value: postgres
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_DB
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: PAPERLESS_SECRET_KEY
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          # Nextcloud's NFS mount has gone stale (ESTALE) multiple times on
          # this NAS with no probe to catch it, staying silently broken for
          # hours — adding this here too since /media is NFS the same way.
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          nfs:
            server: 10.10.10.101
            path: /mnt/user/paperless
