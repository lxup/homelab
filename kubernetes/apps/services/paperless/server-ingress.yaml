# Public via the UDM Pro's 80/443 port-forward to Traefik's LB IP — the
# Cloudflare A record for paperless.nvlab.fr is kept pointed at the home
# WAN IP by the DDNS updater (kubernetes/core/services/external-dns/),
# unproxied group — large PDF/scan uploads can exceed Cloudflare's 100MB
# proxied-request cap, same as Nextcloud.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - paperless.nvlab.fr
      secretName: paperless-tls
  rules:
    - host: paperless.nvlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless
                port:
                  number: 8000
