# SOPS encryption rules for this repo.
# One Age key pair is used for the whole homelab (Talos secrets + Kubernetes
# secrets). Generated with `age-keygen -o ~/.config/sops/age/keys.txt`
# (the CLI's install step does this for you automatically on first run —
# this one was generated manually ahead of time).
# This file only ever holds the PUBLIC key — the private key must never be
# committed and must be backed up somewhere safe outside git.
keys:
  - &homelab age1xze49rtd29dpev58l3lsddpm986nk2vxh7pg4u7sy06rtnt82upszgkx5r

creation_rules:
  # Talos cluster secrets (certs, tokens) generated by talhelper.
  - path_regex: talos/talsecret\.sops\.yaml$
    key_groups:
      - age:
          - *homelab

  # Any Kubernetes secret manifest, anywhere under kubernetes/, named
  # *.sops.yaml (convention used by every ExternalSecret-free secret in
  # this repo — keep secrets in their own file so plain manifests stay
  # cleartext and diff-friendly).
  - path_regex: kubernetes/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - *homelab
